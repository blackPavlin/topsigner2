openapi: 3.0.0
info:
  version: '1.0.0'
  title: Topsigner
  description: |
    Modern image generator and sender for social media
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Auth
    description: Operations with authorization
  - name: Image
    description: Operations with images
  - name: Font
    description: Operations with fonts
security:
  - BearerAuth: [ ]
paths:
  /api/v1/auth/login:
    post:
      summary: Login user
      description: Login user and get tokens
      operationId: authLogin
      tags:
        - Auth
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      summary: Logout user
      description: Invalidate refresh token and drop session
      operationId: authLogout
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              type: object
              properties: 
                refreshToken:
                  type: string
      responses:
        '204':
          description: Logout successful
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/refresh:
    post:
      summary: Refresh auth tokens
      description: Exchange refresh token
      operationId: authRefresh
      tags:
        - Auth
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Tokens successfully refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/images:
    get:
      summary: Get list of user images
      description: Returns a paginated list of user images
      operationId: getImages
      tags:
        - Image
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated list of images
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Upload image file
      description: Uploads a new image file
      operationId: uploadImage
      tags:
        - Image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  description: Image file to upload
                  type: string
                  format: binary  
      responses:
        '201':
          description: Image successfully uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/images/{name}:
    delete:
      summary: Delete image by name
      description: Delete image by name
      operationId: deleteImageByName
      tags:
        - Image
      responses:
        '204':
          description: Image successfully deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    parameters:
      - name: name
        in: path
        required: true
        description: Image name
        schema:
          type: string
  /api/v1/fonts:
    get:
      summary: Get list of fonts
      description: Returns a paginated list of fonts
      operationId: getFonts
      tags:
        - Font
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated list of fonts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FontList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token for authenticated endpoints

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Cursor for pagination
      required: false
      schema:
        type: string

    Limit:
      name: limit
      in: query
      description: Maximum number of items to return
      required: false
      schema:
        type: integer

  schemas:
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable error description

    Pagination:
      type: object
      required:
        - has_next
      properties:
        next_cursor:
          type: string
          nullable: true
          x-order: 1
        has_next:
          type: boolean
          x-order: 2

    AuthTokens:
      type: object
      description: Pair of auth tokens
      required:
        - access_token
        - refresh_token
      properties:
        access_token:
          type: string
          x-order: 1
        refresh_token:
          type: string
          x-order: 2

    Image:
      type: object
      description: Image resource
      required:
        - id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          x-order: 1
        name:
          type: string
          x-order: 2
        created_at:
          type: string
          format: date-time
          x-order: 3
        updated_at:
          type: string
          format: date-time
          x-order: 4

    ImageList:
      type: object
      description: List of images with cursor pagination
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Image'
          x-order: 1  
        pagination:
          $ref: '#/components/schemas/Pagination'

    Font:
      type: object
      description: Font resource
      required:
        - id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          x-order: 1
        name:
          type: string
          x-order: 2
        created_at:
          type: string
          format: date-time
          x-order: 3
        updated_at:
          type: string
          format: date-time
          x-order: 4

    FontList:
      type: object
      description: List of fonts with cursor pagination
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Font'
          x-order: 1  
        pagination:
          $ref: '#/components/schemas/Pagination'

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    UnsupportedMediaType:
      description: Unsupported file type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
