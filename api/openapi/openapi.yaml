openapi: 3.0.3
info:
  version: '1.0.0'
  title: Topsigner
  description: |
    Modern image generator and sender for social media
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Health
    description: Application health check
  - name: Auth
    description: Authentication and token management
  - name: Image
    description: Operations with images
  - name: Font
    description: Operations with fonts
  - name: Group
    description: Operations with groups
security:
  - BearerAuth: [ ]
paths:
  /api/v1/health:
    get:
      summary: Health check
      description: Returns the health status of the application
      operationId: healthCheck
      tags:
        - Health
      security: [ ]
      responses:
        '200':
          description: Application and dependencies are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Application or dependencies are unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /api/v1/auth/login:
    post:
      summary: Login user
      description: Login with email and password
      operationId: loginUser
      tags:
        - Auth
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      summary: Logout user
      description: Invalidate refresh token and drop session
      operationId: logoutUser
      tags:
        - Auth
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Logout successful
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/refresh:
    post:
      summary: Refresh auth tokens
      description: Exchange refresh token
      operationId: refreshTokens
      tags:
        - Auth
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens successfully refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/vkid/authorize:
    get:
      summary: Get VK ID authorization URL
      description: Builds and returns authorization URL
      operationId: getVKIDAuthorizationURL
      tags:
        - Auth
      security: [ ]
      responses:
        '200':
          description: Authorization URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VKIDAuthorization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/vkid/callback:
    get:
      summary: Exchange VK ID authorization code
      description: Exchange the authorization code for a pair of tokens
      operationId: handleVKIDCallback
      tags:
        - Auth
      security: [ ]
      parameters:
        - name: code
          in: query
          description: Authorization code issued by the provider
          required: false
          schema:
            type: string
        - name: state
          in: query
          description: Opaque value used to prevent CSRF attacks
          required: false
          schema:
            type: string
        - name: device_id
          in: query
          required: false
          description: Unique device identifier
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Error code
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          description: Error description
          schema:
            type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/images:
    get:
      summary: Get list of user images
      description: Returns a paginated list of user images
      operationId: listImages
      tags:
        - Image
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated list of images
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Upload image file
      description: Uploads a new image file
      operationId: uploadImage
      tags:
        - Image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadImageRequest'
            encoding:
              file:
                contentType: image/jpeg, image/png
      responses:
        '201':
          description: Image successfully uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/images/{image_id}:
    parameters:
      - name: image_id
        in: path
        required: true
        description: Image ID
        schema:
          type: integer
          format: int64
    delete:
      summary: Delete image
      description: Delete user image by id
      operationId: deleteImage
      tags:
        - Image
      responses:
        '204':
          description: Image successfully deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/fonts:
    get:
      summary: Get list of fonts
      description: Returns a paginated list of fonts
      operationId: listFonts
      tags:
        - Font
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated list of fonts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FontList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/groups:
    get:
      summary: Get list of groups
      description: Returns a paginated list of groups
      operationId: listGroups
      tags:
        - Group
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated list of groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/groups/connect:
    get:
      summary: Get URL to connect group
      description: Get VK authorization URL to connect group
      operationId: getGroupConnectionURL
      tags:
        - Group
      parameters:
        - name: group_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Authorization URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupAuthorization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/groups/callback:
    get:
      summary: Exchange group authorization code
      description: Exchange group authorization code for connect group
      operationId: handleGroupCallback
      tags:
        - Group
      security: [ ]
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Error code
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          description: Error description
          schema:
            type: string
      responses:
        '200':
          description: Group successfully connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    BearerAuth:
      description: Access token for authenticated endpoints
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Cursor for pagination
      required: false
      schema:
        type: string

    Limit:
      name: limit
      in: query
      description: Maximum number of items to return
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 50

  schemas:
    Error:
      type: object
      required:
        - message
      properties:
        message:
          description: Human-readable error description
          type: string

    Pagination:
      type: object
      required:
        - next_cursor
      properties:
        next_cursor:
          type: string
          nullable: true

    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - down

    LoginRequest:
      type: object
      description: Credentials for email/password login
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          x-go-type: string
          x-oapi-codegen-extra-tags:
            validate: required,email
        password:
          type: string
          minLength: 1
          x-oapi-codegen-extra-tags:
            validate: required,min=1

    LogoutRequest:
      type: object
      description: Logout options
      properties:
        all_sessions:
          type: boolean
          default: false

    RefreshRequest:
      type: object
      description: Refresh token exchange request
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
          x-oapi-codegen-extra-tags:
            validate: required,min=1

    UploadImageRequest:
      type: object
      description: Multipart form with an image file
      required:
        - file
      properties:
        file:
          description: Image file to upload
          type: string
          format: binary

    AuthTokens:
      type: object
      description: Pair of auth tokens
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          x-order: 1
        refresh_token:
          type: string
          x-order: 2
        token_type:
          type: string
          enum:
            - Bearer
          x-order: 3
        expires_in:
          type: integer
          format: int64
          x-order: 4

    VKIDAuthorization:
      type: object
      description: OAuth authorization URL
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          x-order: 1

    GroupAuthorization:
      type: object
      description: Group authorization URL
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          x-order: 1

    Image:
      type: object
      description: Image resource
      required:
        - id
        - url
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          x-order: 1
        url:
          type: string
          format: uri
          x-order: 2
        name:
          type: string
          x-order: 3
        created_at:
          type: string
          format: date-time
          x-order: 4
        updated_at:
          type: string
          format: date-time
          x-order: 5

    ImageList:
      type: object
      description: List of images with cursor pagination
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Image'
          x-order: 1
        pagination:
          $ref: '#/components/schemas/Pagination'
          x-order: 2

    Font:
      type: object
      description: Font resource
      required:
        - id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          x-order: 1
        name:
          type: string
          x-order: 2
        created_at:
          type: string
          format: date-time
          x-order: 3
        updated_at:
          type: string
          format: date-time
          x-order: 4

    FontList:
      type: object
      description: List of fonts with cursor pagination
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Font'
          x-order: 1
        pagination:
          $ref: '#/components/schemas/Pagination'
          x-order: 2

    Group:
      type: object
      description: Group resource
      required:
        - id
        - name
        - screen_name
        - is_connected
      properties:
        id:
          type: integer
          format: int64
          x-order: 1
        name:
          type: string
          x-order: 2
        screen_name:
          type: string
          x-order: 3
        is_connected:
          type: boolean
          x-order: 4

    GroupList:
      type: object
      description: List of groups with cursor pagination
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Group'
          x-order: 1
        pagination:
          $ref: '#/components/schemas/Pagination'
          x-order: 2

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    PayloadTooLarge:
      description: Payload too large
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    UnsupportedMediaType:
      description: Unsupported file type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          required: true
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
